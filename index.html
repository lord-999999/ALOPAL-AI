<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Cloud AI</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #chat-container { width: 90%; max-width: 600px; background: #1e293b; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; height: 80vh; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        #messages { flex: 1; overflow-y: auto; margin-bottom: 15px; padding: 10px; background: #0f172a; border-radius: 8px; display: flex; flex-direction: column; gap: 12px; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #475569; background: #334155; color: white; font-size: 1rem; outline: none; }
        button { padding: 0 24px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #2563eb; }
        .msg { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .user { background: #3b82f6; align-self: flex-end; }
        .ai { background: #334155; align-self: flex-start; }
    </style>
</head>
<body>

    <div id="chat-container">
        <h2 style="margin-top:0;">Instant Cloud AI</h2>
        <div id="messages">
            <div class="msg ai">Hello! Ask me anything. I am running entirely on external servers.</div>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') send()" />
            <button onclick="send()">Send</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById("messages");
        const box = document.getElementById("userInput");

        async function send() {
            const text = box.value.trim();
            if (!text) return;

            // Add user bubble
            chat.innerHTML += `<div class="msg user">${text}</div>`;
            box.value = "";
            chat.scrollTop = chat.scrollHeight;

            // Add thinking placeholder
            const aiBubble = document.createElement("div");
            aiBubble.className = "msg ai";
            aiBubble.innerText = "Thinking...";
            chat.appendChild(aiBubble);
            chat.scrollTop = chat.scrollHeight;

            try {
                // Sends text to a public text-generation engine endpoint
                const res = await fetch(`https://pollinations.ai{encodeURIComponent(text)}`);
                const reply = await res.text();
                aiBubble.innerText = reply;
            } catch (err) {
                aiBubble.innerText = "Connection down. Try again shortly!";
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
