<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPAL AI</title>
    <script src="https://jsdelivr.com/npm/marked@4.3.0/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
        }
        #chat-container {
            width: 100%;
            max-width: 650px;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            height: 85vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h2 { margin-top: 0; margin-bottom: 16px; font-weight: 700; font-size: 1.5rem; letter-spacing: -0.025em; }
        #messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
            padding: 16px;
            background: #0f172a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid #1e293b;
        }
        .input-group { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #334155;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #3b82f6; }
        button {
            padding: 0 24px;
            border-radius: 10px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }
        
        /* New Voice Feature Buttons Styling */
        #mic-btn { background: #10b981; }
        #mic-btn:hover { background: #059669; }
        #mic-btn.listening { background: #ef4444; animation: pulse 1.5s infinite; }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }
        .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.ai { align-self: flex-start; align-items: flex-start; }

        .msg { padding: 12px 16px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; font-size: 0.95rem; width: 100%; }
        .user .msg { background: #3b82f6; color: white; border-bottom-right-radius: 2px; }
        .ai .msg { background: #334155; color: #f1f5f9; border-bottom-left-radius: 2px; }
        
        .speak-msg-btn {
            background: transparent;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: normal;
            padding: 4px 8px;
            margin-top: 4px;
            border-radius: 4px;
            align-self: flex-start;
        }
        .speak-msg-btn:hover { background: #334155; color: #f8fafc; }

        .error .msg { background: #7f1d1d; border: 1px solid #f87171; color: #fca5a5; }
        .msg p { margin: 0 0 8px 0; }
        .msg p:last-child { margin-bottom: 0; }
        .msg code { background: #1e293b; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.85rem; color: #f43f5e; }
        .msg pre { background: #0f172a; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid #334155; }
        .msg pre code { background: transparent; padding: 0; color: #e2e8f0; font-size: 0.85rem; }
        .msg ul, .msg ol { margin: 4px 0; padding-left: 20px; }
        
        .thinking { opacity: 0.7; font-style: italic; animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="chat-container">
        <h2>OPAL AI</h2>
        <div id="messages">
            <div class="msg-wrapper ai">
                <div class="msg">Hello! Ask me anything. I am powered by a live, open-infrastructure cloud engine.</div>
                <button class="speak-msg-btn" onclick="speakText(this.previousElementSibling.innerText)">🔊 Speak</button>
            </div>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" onkeypress="if(event.key === 'Enter') send()" />
            <button id="sendBtn" onclick="send()">Send</button>
            <button id="mic-btn" onclick="toggleListening()">🎤 Mic</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById("messages");
        const box = document.getElementById("userInput");
        const btn = document.getElementById("sendBtn");
        const micBtn = document.getElementById("mic-btn");

        // Native Speech Synthesis (Text to Speech Engine)
        function speakText(text) {
            window.speechSynthesis.cancel(); // Stop any currently playing audio track
            if (!text.trim()) return;

            // Remove markdown syntax formatting so the engine reads clean text naturally
            const cleanText = text.replace(/[*_`#\-]/g, '').trim();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // Native Speech Recognition Setup (Speech to Text Microphone Input)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                micBtn.textContent = "🛑 Stop";
                micBtn.classList.add("listening");
                box.placeholder = "Listening to your voice...";
            };

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                box.value = speechToText;
                send(); // Auto-send the transcribed speech context directly
            };

            recognition.onerror = (e) => {
                console.error("Speech recognition error", e);
                resetMicButton();
            };

            recognition.onend = () => {
                resetMicButton();
            };
        } else {
            micBtn.style.display = "none"; // Hide button if OS microphone features are blocked/unavailable
        }

        function toggleListening() {
            if (!recognition) return;
            window.speechSynthesis.cancel(); // Stop talking if user wants to speak
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function resetMicButton() {
            isListening = false;
            micBtn.textContent = "🎤 Mic";
            micBtn.classList.remove("listening");
            box.placeholder = "Type a message...";
        }

        const systemPrompt = "You are a helpful, concise AI assistant.";
        let conversationHistory = [
            { role: "system", content: systemPrompt }
        ];

        if (typeof marked !== 'undefined') {
            marked.setOptions({ gfm: true, breaks: true });
        }

        async function send() {
            const text = box.value.trim();
            if (!text || btn.disabled) return;

            box.disabled = true;
            btn.disabled = true;
            if (isListening) recognition.stop();

            // Render User Bubble
            const userWrapper = document.createElement("div");
            userWrapper.className = "msg-wrapper user";
            const userBubble = document.createElement("div");
            userBubble.className = "msg";
            userBubble.textContent = text;
            userWrapper.appendChild(userBubble);
            chat.appendChild(userWrapper);
            
            box.value = "";
            chat.scrollTop = chat.scrollHeight;
            conversationHistory.push({ role: "user", content: text });

            // Render AI Bubble structure
            const aiWrapper = document.createElement("div");
            aiWrapper.className = "msg-wrapper ai";
            const aiBubble = document.createElement("div");
            aiBubble.className = "msg thinking";
            aiBubble.textContent = "...";
            aiWrapper.appendChild(aiBubble);
            chat.appendChild(aiWrapper);
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch("https://text.pollinations.ai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "openai",
                        messages: conversationHistory,
                        stream: true
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned status: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let completeText = "";
                let buffer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();

                    for (const line of lines) {
                        const cleanedLine = line.trim();
                        if (!cleanedLine || cleanedLine === "data: [DONE]") continue;

                        if (cleanedLine.startsWith("data: ")) {
                            try {
                                const parsed = JSON.parse(cleanedLine.replace(/^data:\s*/, ""));
                                const contentChunk = parsed.choices?.[0]?.delta?.content || "";
                                if (contentChunk) {
                                    if (aiBubble.classList.contains("thinking")) {
                                        aiBubble.classList.remove("thinking");
                                        aiBubble.textContent = "";
                                    }

                                    completeText += contentChunk;

                                    if (typeof marked !== 'undefined') {
                                        aiBubble.innerHTML = marked.parse(completeText);
                                    } else {
                                        aiBubble.textContent = completeText;
                                    }
                                    chat.scrollTop = chat.scrollHeight;
                                }
                            } catch (e) {
                                console.warn("Failed to parse line chunk:", cleanedLine, e);
                            }
                        }
                    }
                }

                // Append the dynamic text-to-speech button right after streaming ends
                const speakBtn = document.createElement("button");
                speakBtn.className = "speak-msg-btn";
                speakBtn.innerHTML = "🔊 Speak";
                speakBtn.onclick = function() { speakText(aiBubble.innerText); };
                aiWrapper.appendChild(speakBtn);

                conversationHistory.push({ role: "assistant", content: completeText });

            } catch (error) {
                console.error(error);
                aiBubble.classList.remove("thinking");
                aiWrapper.className = "msg-wrapper ai error";
                aiBubble.textContent = `Error: ${error.message}`;
            } finally {
                box.disabled = false;
                btn.disabled = false;
                box.focus();
            }
        }
    </script>
</body>
</html>
